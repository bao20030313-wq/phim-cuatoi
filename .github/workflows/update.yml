name: Tu dong cap nhat phim KKPhim

on:
  schedule:
    - cron: '0 */6 * * *'   # Chạy mỗi 6 tiếng
  workflow_dispatch:          # Cho phép bấm chạy tay

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Quan trọng: cho phép ghi file
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cai thu vien
        run: pip install requests
      
      - name: Chay script tao M3U
        run: python generate_m3u.py
      
      - name: Commit va push file moi
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@github.com"
          git add kkphim.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Cap nhat phim $(date +'%Y-%m-%d %H:%M')"
          git push
